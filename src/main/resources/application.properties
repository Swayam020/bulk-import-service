spring.application.name=bulkimport

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bulkimport}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:bulkimport}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.import.storage-dir=${IMPORT_STORAGE_DIR:data/uploads}
app.import.worker.enabled=${IMPORT_WORKER_ENABLED:true}
app.import.worker.poll-delay-ms=1000

spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
