services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: bulkimport
      POSTGRES_PASSWORD: bulkimport
    ports:
      - "5433:5432"
    volumes:
      - bulkimport-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bulkimport
      DB_PASSWORD: bulkimport
    volumes:
      # queued and interrupted jobs still need their file after the container is recreated
      - bulkimport-uploads:/app/data/uploads
    # SIGTERM lets the running import finish; the 10 s default would SIGKILL a large one (it resumes, but needlessly)
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  bulkimport-pg-data:
  bulkimport-uploads:
