services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: bulkimport
      POSTGRES_PASSWORD: bulkimport
    ports:
      - "5433:5432"
    volumes:
      - bulkimport-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bulkimport-pg-data:
